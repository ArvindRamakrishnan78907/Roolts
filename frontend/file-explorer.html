<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roolts - VS Code File Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            background: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 10px 15px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            font-size: 11px;
            text-transform: uppercase;
            color: #cccccc;
            font-weight: 600;
        }

        .file-explorer {
            flex: 1;
            overflow-y: auto;
            padding: 5px 0;
        }

        .file-tree {
            list-style: none;
        }

        .file-tree-item {
            padding: 2px 0;
            user-select: none;
        }

        .file-tree-item.selected {
            background: #094771;
        }

        .file-tree-item:hover {
            background: #2a2d2e;
        }

        .file-tree-label {
            display: flex;
            align-items: center;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .file-tree-icon {
            margin-right: 6px;
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        .folder-toggle {
            margin-right: 4px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cccccc;
        }

        .folder-toggle:before {
            content: '▶';
            font-size: 10px;
            transition: transform 0.2s;
        }

        .folder-toggle.expanded:before {
            transform: rotate(90deg);
        }

        .file-tree-children {
            padding-left: 16px;
            display: none;
        }

        .file-tree-children.expanded {
            display: block;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }

        .tab-bar {
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            padding: 0;
            display: flex;
            min-height: 35px;
            align-items: stretch;
        }

        .tab {
            background: #2d2d30;
            border-right: 1px solid #3e3e42;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .tab.active {
            background: #1e1e1e;
            color: #ffffff;
        }

        .tab:hover {
            background: #37373d;
        }

        .tab-close {
            margin-left: 8px;
            cursor: pointer;
            opacity: 0.7;
        }

        .tab-close:hover {
            opacity: 1;
        }

        .editor-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .editor {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #cccccc;
            border: none;
            outline: none;
            padding: 20px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            resize: none;
            line-height: 1.5;
        }

        .status-bar {
            background: #007acc;
            color: white;
            padding: 4px 15px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .context-menu {
            position: fixed;
            background: #383838;
            border: 1px solid #5a5a5a;
            border-radius: 3px;
            padding: 4px 0;
            min-width: 150px;
            z-index: 1000;
            display: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .context-menu-item {
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .context-menu-item:hover {
            background: #094771;
        }

        .context-menu-separator {
            height: 1px;
            background: #5a5a5a;
            margin: 4px 0;
        }

        .toolbar {
            display: flex;
            gap: 5px;
            padding: 5px 10px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
        }

        .toolbar-button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .toolbar-button:hover {
            background: #1177bb;
        }

        .sync-indicator {
            padding: 2px 8px;
            background: #16825d;
            color: white;
            border-radius: 3px;
            font-size: 11px;
        }

        .sync-indicator.error {
            background: #cc2936;
        }

        .file-breadcrumb {
            padding: 8px 15px;
            background: #37373d;
            font-size: 12px;
            border-bottom: 1px solid #3e3e42;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            color: #888;
        }

        .spinner {
            border: 2px solid #3e3e42;
            border-top: 2px solid #0e639c;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* File Icons */
        .file-icon {
            width: 16px;
            height: 16px;
            margin-right: 6px;
        }

        .file-icon.folder {
            color: #dcb67a;
        }

        .file-icon.file {
            color: #cccccc;
        }

        .file-icon.js {
            color: #f7df1e;
        }

        .file-icon.py {
            color: #3776ab;
        }

        .file-icon.html {
            color: #e44d26;
        }

        .file-icon.css {
            color: #1572b6;
        }

        .file-icon.json {
            color: #00d8ff;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                Explorer
                <div class="sync-indicator" id="syncIndicator">
                    🔄 Connecting...
                </div>
            </div>
            <div class="toolbar">
                <button class="toolbar-button" onclick="createNewFile()">📄 New File</button>
                <button class="toolbar-button" onclick="createNewFolder()">📁 New Folder</button>
                <button class="toolbar-button" onclick="refreshFiles()">🔄 Refresh</button>
            </div>
            <div class="file-explorer">
                <div class="loading" id="loadingIndicator">
                    <div class="spinner"></div>
                    Loading files...
                </div>
                <ul class="file-tree" id="fileTree"></ul>
            </div>
        </div>

        <div class="main-content">
            <div class="tab-bar" id="tabBar"></div>
            <div class="file-breadcrumb" id="breadcrumb">
                Select a file to edit
            </div>
            <div class="editor-area">
                <textarea class="editor" id="editor" placeholder="Select a file to start editing..."></textarea>
            </div>
            <div class="status-bar">
                <span id="statusText">Ready</span>
                <span id="cursorPosition">Ln 1, Col 1</span>
            </div>
        </div>
    </div>

    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" onclick="openFile()">🔍 Open</div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" onclick="renameItem()">✏️ Rename</div>
        <div class="context-menu-item" onclick="deleteItem()">🗑️ Delete</div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" onclick="copyPath()">📋 Copy Path</div>
    </div>

    <script>
        class FileExplorer {
            constructor() {
                this.socket = null;
                this.fileTree = {};
                this.openTabs = new Map();
                this.currentFile = null;
                this.isConnected = false;
                this.unsavedFiles = new Set();

                this.initializeSocket();
                this.setupEventListeners();
                this.connectToFileSync();
            }

            initializeSocket() {
                this.socket = io('http://localhost:5000');

                this.socket.on('connect', () => {
                    console.log('Connected to server');
                    this.updateSyncIndicator('🟢 Connected', 'success');
                });

                this.socket.on('disconnect', () => {
                    console.log('Disconnected from server');
                    this.updateSyncIndicator('🔴 Disconnected', 'error');
                    this.isConnected = false;
                });

                this.socket.on('file_sync_joined', (data) => {
                    console.log('Joined file sync:', data);
                    this.isConnected = true;
                    this.updateSyncIndicator('🟢 Synced', 'success');
                    this.loadFileTree();
                });

                this.socket.on('file_sync_error', (data) => {
                    console.error('File sync error:', data);
                    this.updateSyncIndicator('🔴 Error', 'error');
                });

                this.socket.on('file_tree_update', (data) => {
                    console.log('File tree updated:', data);
                    this.renderFileTree(data.tree);
                });

                this.socket.on('file_change', (data) => {
                    console.log('File changed:', data);
                    this.handleFileChange(data);
                });

                this.socket.on('file_content_update', (data) => {
                    console.log('File content updated:', data);
                    this.handleContentUpdate(data);
                });

                this.socket.on('file_created', (data) => {
                    console.log('File created:', data);
                    this.refreshFiles();
                });

                this.socket.on('file_deleted', (data) => {
                    console.log('File deleted:', data);
                    this.handleFileDeleted(data);
                });

                this.socket.on('file_renamed', (data) => {
                    console.log('File renamed:', data);
                    this.handleFileRenamed(data);
                });
            }

            connectToFileSync() {
                if (this.socket && this.socket.connected) {
                    this.socket.emit('join_file_sync', { token: null }); // Development mode
                }
            }

            setupEventListeners() {
                const editor = document.getElementById('editor');
                let saveTimeout;

                editor.addEventListener('input', () => {
                    if (this.currentFile) {
                        this.markAsUnsaved(this.currentFile);

                        // Auto-save after 2 seconds of inactivity
                        clearTimeout(saveTimeout);
                        saveTimeout = setTimeout(() => {
                            this.saveCurrentFile();
                        }, 2000);
                    }
                });

                editor.addEventListener('keyup', () => {
                    this.updateCursorPosition();
                });

                editor.addEventListener('click', () => {
                    this.updateCursorPosition();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 's' && this.currentFile) {
                        e.preventDefault();
                        this.saveCurrentFile();
                    }

                    if (e.ctrlKey && e.key === 'w' && this.currentFile) {
                        e.preventDefault();
                        this.closeTab(this.currentFile);
                    }
                });

                // Context menu
                document.addEventListener('click', () => {
                    this.hideContextMenu();
                });

                document.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                });
            }

            async loadFileTree() {
                try {
                    this.updateStatus('Loading file tree...');

                    if (this.socket && this.isConnected) {
                        this.socket.emit('request_file_tree');
                    } else {
                        // Fallback to HTTP API
                        const response = await fetch('http://localhost:5000/api/file-sync/tree');
                        if (response.ok) {
                            const data = await response.json();
                            this.renderFileTree(data.tree);
                        } else {
                            throw new Error('Failed to load file tree');
                        }
                    }

                } catch (error) {
                    console.error('Error loading file tree:', error);
                    this.updateStatus('Error loading files');
                    document.getElementById('loadingIndicator').innerHTML =
                        '<div style="color: #cc2936;">❌ Error loading files</div>';
                }
            }

            renderFileTree(tree) {
                const fileTreeElement = document.getElementById('fileTree');
                const loadingElement = document.getElementById('loadingIndicator');

                loadingElement.style.display = 'none';
                fileTreeElement.innerHTML = '';

                if (!tree || tree.length === 0) {
                    fileTreeElement.innerHTML = '<li style="padding: 10px; color: #888;">No files found</li>';
                    return;
                }

                tree.forEach(item => {
                    const li = this.createTreeItem(item);
                    fileTreeElement.appendChild(li);
                });

                this.updateStatus('File tree loaded');
            }

            createTreeItem(item, depth = 0) {
                const li = document.createElement('li');
                li.className = 'file-tree-item';
                li.style.paddingLeft = (depth * 16) + 'px';

                const label = document.createElement('div');
                label.className = 'file-tree-label';

                if (item.isDirectory) {
                    const toggle = document.createElement('span');
                    toggle.className = 'folder-toggle';
                    toggle.onclick = (e) => {
                        e.stopPropagation();
                        this.toggleFolder(li, item);
                    };
                    label.appendChild(toggle);

                    const icon = document.createElement('span');
                    icon.innerHTML = '📁';
                    icon.className = 'file-icon folder';
                    label.appendChild(icon);
                } else {
                    const spacer = document.createElement('span');
                    spacer.style.width = '16px';
                    spacer.style.display = 'inline-block';
                    label.appendChild(spacer);

                    const icon = document.createElement('span');
                    icon.innerHTML = this.getFileIcon(item.extension);
                    icon.className = `file-icon file ${this.getFileClass(item.extension)}`;
                    label.appendChild(icon);
                }

                const name = document.createElement('span');
                name.textContent = item.name;
                label.appendChild(name);

                label.onclick = () => this.selectItem(item, li);
                label.oncontextmenu = (e) => {
                    e.preventDefault();
                    this.showContextMenu(e, item);
                };

                li.appendChild(label);

                if (item.isDirectory && item.children) {
                    const childrenContainer = document.createElement('ul');
                    childrenContainer.className = 'file-tree-children';

                    item.children.forEach(child => {
                        const childItem = this.createTreeItem(child, depth + 1);
                        childrenContainer.appendChild(childItem);
                    });

                    li.appendChild(childrenContainer);
                }

                return li;
            }

            getFileIcon(extension) {
                const iconMap = {
                    '.js': '📜',
                    '.py': '🐍',
                    '.html': '🌐',
                    '.css': '🎨',
                    '.json': '📊',
                    '.md': '📝',
                    '.txt': '📄',
                    '.jpg': '🖼️',
                    '.png': '🖼️',
                    '.gif': '🖼️',
                    '.pdf': '📕',
                    '.zip': '🗂️',
                    '.exe': '⚙️'
                };

                return iconMap[extension] || '📄';
            }

            getFileClass(extension) {
                const classMap = {
                    '.js': 'js',
                    '.py': 'py',
                    '.html': 'html',
                    '.css': 'css',
                    '.json': 'json'
                };

                return classMap[extension] || '';
            }

            toggleFolder(li, item) {
                const toggle = li.querySelector('.folder-toggle');
                const children = li.querySelector('.file-tree-children');

                if (children) {
                    const isExpanded = children.classList.contains('expanded');

                    if (isExpanded) {
                        children.classList.remove('expanded');
                        toggle.classList.remove('expanded');
                    } else {
                        children.classList.add('expanded');
                        toggle.classList.add('expanded');
                    }
                }
            }

            async selectItem(item, element) {
                // Remove previous selection
                document.querySelectorAll('.file-tree-item.selected').forEach(el => {
                    el.classList.remove('selected');
                });

                element.classList.add('selected');

                if (!item.isDirectory) {
                    await this.openFile(item);
                }
            }

            async openFile(item) {
                try {
                    this.updateStatus(`Loading ${item.name}...`);

                    const response = await fetch(`http://localhost:5000/api/file-sync/read?path=${encodeURIComponent(item.path)}`);

                    if (!response.ok) {
                        throw new Error(`Failed to load file: ${response.statusText}`);
                    }

                    const data = await response.json();

                    if (data.success) {
                        this.openTab(item, data.content);
                        this.updateStatus(`Opened ${item.name}`);
                    } else {
                        throw new Error(data.error);
                    }

                } catch (error) {
                    console.error('Error opening file:', error);
                    this.updateStatus(`Error opening ${item.name}`);
                    alert(`Error opening file: ${error.message}`);
                }
            }

            openTab(item, content) {
                // Add to open tabs
                this.openTabs.set(item.path, {
                    item: item,
                    content: content,
                    originalContent: content
                });

                // Set as current file
                this.currentFile = item.path;

                // Update editor
                document.getElementById('editor').value = content;

                // Update breadcrumb
                document.getElementById('breadcrumb').textContent = item.path;

                // Render tabs
                this.renderTabs();

                this.updateCursorPosition();
            }

            renderTabs() {
                const tabBar = document.getElementById('tabBar');
                tabBar.innerHTML = '';

                this.openTabs.forEach((tabData, path) => {
                    const tab = document.createElement('div');
                    tab.className = 'tab';

                    if (path === this.currentFile) {
                        tab.classList.add('active');
                    }

                    const title = document.createElement('span');
                    title.textContent = tabData.item.name;

                    if (this.unsavedFiles.has(path)) {
                        title.textContent = '● ' + tabData.item.name;
                    }

                    tab.appendChild(title);

                    const closeBtn = document.createElement('span');
                    closeBtn.className = 'tab-close';
                    closeBtn.innerHTML = '✕';
                    closeBtn.onclick = (e) => {
                        e.stopPropagation();
                        this.closeTab(path);
                    };
                    tab.appendChild(closeBtn);

                    tab.onclick = () => {
                        this.switchToTab(path);
                    };

                    tabBar.appendChild(tab);
                });
            }

            switchToTab(path) {
                this.currentFile = path;
                const tabData = this.openTabs.get(path);

                if (tabData) {
                    document.getElementById('editor').value = tabData.content;
                    document.getElementById('breadcrumb').textContent = path;
                    this.renderTabs();
                    this.updateCursorPosition();
                }
            }

            closeTab(path) {
                if (this.unsavedFiles.has(path)) {
                    if (!confirm('You have unsaved changes. Close anyway?')) {
                        return;
                    }
                }

                this.openTabs.delete(path);
                this.unsavedFiles.delete(path);

                if (this.currentFile === path) {
                    // Switch to another tab or clear editor
                    const remainingTabs = Array.from(this.openTabs.keys());
                    if (remainingTabs.length > 0) {
                        this.switchToTab(remainingTabs[0]);
                    } else {
                        this.currentFile = null;
                        document.getElementById('editor').value = '';
                        document.getElementById('breadcrumb').textContent = 'Select a file to edit';
                    }
                }

                this.renderTabs();
            }

            async saveCurrentFile() {
                if (!this.currentFile) return;

                try {
                    this.updateStatus('Saving...');

                    const content = document.getElementById('editor').value;
                    const response = await fetch('http://localhost:5000/api/file-sync/write', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            path: this.currentFile,
                            content: content
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();

                        if (data.success) {
                            // Update tab data
                            const tabData = this.openTabs.get(this.currentFile);
                            if (tabData) {
                                tabData.content = content;
                                tabData.originalContent = content;
                            }

                            this.markAsSaved(this.currentFile);
                            this.updateStatus('File saved');
                        } else {
                            throw new Error(data.error);
                        }
                    } else {
                        throw new Error(`Save failed: ${response.statusText}`);
                    }

                } catch (error) {
                    console.error('Error saving file:', error);
                    this.updateStatus('Error saving file');
                    alert(`Error saving file: ${error.message}`);
                }
            }

            markAsUnsaved(path) {
                this.unsavedFiles.add(path);

                // Update tab data
                const tabData = this.openTabs.get(path);
                if (tabData) {
                    tabData.content = document.getElementById('editor').value;
                }

                this.renderTabs();
            }

            markAsSaved(path) {
                this.unsavedFiles.delete(path);
                this.renderTabs();
            }

            updateCursorPosition() {
                const editor = document.getElementById('editor');
                const textBeforeCursor = editor.value.substring(0, editor.selectionStart);
                const lines = textBeforeCursor.split('\n');
                const lineNumber = lines.length;
                const columnNumber = lines[lines.length - 1].length + 1;

                document.getElementById('cursorPosition').textContent = `Ln ${lineNumber}, Col ${columnNumber}`;
            }

            updateStatus(message) {
                document.getElementById('statusText').textContent = message;
            }

            updateSyncIndicator(message, status = '') {
                const indicator = document.getElementById('syncIndicator');
                indicator.textContent = message;

                indicator.className = 'sync-indicator';
                if (status) {
                    indicator.classList.add(status);
                }
            }

            showContextMenu(event, item) {
                const menu = document.getElementById('contextMenu');
                menu.style.display = 'block';
                menu.style.left = event.pageX + 'px';
                menu.style.top = event.pageY + 'px';

                this.contextMenuItem = item;
            }

            hideContextMenu() {
                document.getElementById('contextMenu').style.display = 'none';
            }

            handleFileChange(data) {
                // Handle real-time file system changes
                if (data.action === 'modified' && this.openTabs.has(data.path)) {
                    // File was modified externally
                    console.log(`File ${data.path} was modified externally`);
                }
            }

            handleContentUpdate(data) {
                // Handle collaborative editing updates
                if (data.path === this.currentFile && data.fromSession !== this.socket.id) {
                    console.log('Received collaborative edit update');
                    // Could implement operational transformation here
                }
            }

            handleFileDeleted(data) {
                // Close tab if the deleted file was open
                if (this.openTabs.has(data.path)) {
                    this.closeTab(data.path);
                }

                this.refreshFiles();
            }

            handleFileRenamed(data) {
                // Update open tab if the renamed file was open
                if (this.openTabs.has(data.oldPath)) {
                    const tabData = this.openTabs.get(data.oldPath);
                    this.openTabs.delete(data.oldPath);
                    this.openTabs.set(data.newPath, tabData);

                    if (this.currentFile === data.oldPath) {
                        this.currentFile = data.newPath;
                    }

                    this.renderTabs();
                }

                this.refreshFiles();
            }

            refreshFiles() {
                this.loadFileTree();
            }
        }

        // Global functions for toolbar and context menu
        let fileExplorer;

        window.onload = () => {
            fileExplorer = new FileExplorer();
        };

        function createNewFile() {
            const fileName = prompt('Enter file name:');
            if (fileName) {
                createFile(fileName, '');
            }
        }

        function createNewFolder() {
            const folderName = prompt('Enter folder name:');
            if (folderName) {
                createDirectory(folderName);
            }
        }

        function refreshFiles() {
            fileExplorer.refreshFiles();
        }

        async function createFile(path, content = '') {
            try {
                const response = await fetch('http://localhost:5000/api/file-sync/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: path,
                        type: 'file',
                        content: content
                    })
                });

                if (response.ok) {
                    fileExplorer.updateStatus(`Created file: ${path}`);
                } else {
                    const error = await response.json();
                    throw new Error(error.error);
                }
            } catch (error) {
                console.error('Error creating file:', error);
                alert(`Error creating file: ${error.message}`);
            }
        }

        async function createDirectory(path) {
            try {
                const response = await fetch('http://localhost:5000/api/file-sync/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: path,
                        type: 'directory'
                    })
                });

                if (response.ok) {
                    fileExplorer.updateStatus(`Created folder: ${path}`);
                } else {
                    const error = await response.json();
                    throw new Error(error.error);
                }
            } catch (error) {
                console.error('Error creating directory:', error);
                alert(`Error creating directory: ${error.message}`);
            }
        }

        // Context menu functions
        function openFile() {
            if (fileExplorer.contextMenuItem) {
                fileExplorer.openFile(fileExplorer.contextMenuItem);
            }
            fileExplorer.hideContextMenu();
        }

        function renameItem() {
            if (fileExplorer.contextMenuItem) {
                const newName = prompt('Enter new name:', fileExplorer.contextMenuItem.name);
                if (newName) {
                    renameFileOrFolder(fileExplorer.contextMenuItem.path, newName);
                }
            }
            fileExplorer.hideContextMenu();
        }

        function deleteItem() {
            if (fileExplorer.contextMenuItem) {
                if (confirm(`Delete ${fileExplorer.contextMenuItem.name}?`)) {
                    deleteFileOrFolder(fileExplorer.contextMenuItem.path);
                }
            }
            fileExplorer.hideContextMenu();
        }

        function copyPath() {
            if (fileExplorer.contextMenuItem) {
                navigator.clipboard.writeText(fileExplorer.contextMenuItem.path);
                fileExplorer.updateStatus('Path copied to clipboard');
            }
            fileExplorer.hideContextMenu();
        }

        async function renameFileOrFolder(oldPath, newName) {
            try {
                const newPath = oldPath.split('/').slice(0, -1).concat(newName).join('/');

                const response = await fetch('http://localhost:5000/api/file-sync/rename', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        oldPath: oldPath,
                        newPath: newPath
                    })
                });

                if (response.ok) {
                    fileExplorer.updateStatus(`Renamed to: ${newName}`);
                } else {
                    const error = await response.json();
                    throw new Error(error.error);
                }
            } catch (error) {
                console.error('Error renaming:', error);
                alert(`Error renaming: ${error.message}`);
            }
        }

        async function deleteFileOrFolder(path) {
            try {
                const response = await fetch(`http://localhost:5000/api/file-sync/delete?path=${encodeURIComponent(path)}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fileExplorer.updateStatus(`Deleted: ${path}`);
                } else {
                    const error = await response.json();
                    throw new Error(error.error);
                }
            } catch (error) {
                console.error('Error deleting:', error);
                alert(`Error deleting: ${error.message}`);
            }
        }
    </script>
</body>

</html>
